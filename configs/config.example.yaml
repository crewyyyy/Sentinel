# IDs below are fictitious. Replace the private moderator destination and allowed user IDs.
telegram:
  mode: polling
  auto_discover_chats: true
  # Add/promote the bot from an allowlisted admin, then confirm its private card.
  # Explicit chat IDs are optional; setting them grants deployment-time consent.
  chat_ids: []
  admin_chat_id: -1002222222222
  allowed_admin_ids: [111111111]
moderation:
  enforcement_enabled: false
  ruleset_version: v4-compact-copy
  risk_ai_threshold: 45
  alert_threshold: 45
  score_thresholds: [25, 45, 70, 85]
  report_aliases: ["/report", "!репорт", "!report"]
  watch_message_edits: true
  # Skip automatic analysis of chat owners/admins; omitted defaults to false.
  # Explicit /report requests still work. Restart after changing this flag.
  ignore_admin_messages: true
  # Weights not supplied here use internal/rules.DefaultConfig(). Bump ruleset_version after changes.
  weights: {}
# Existing deployments without this block retain v1 behavior.
# Change ruleset_version before changing modules, dictionaries or caps.
analysis:
  modules:
    referral_cues:
      enabled: true
    # Chat rule: matching offers require review, never automatic sanctions.
    # /modules can override optional modules per chat without restart.
    sales:
      enabled: true
      thresholds: {policy: 1, sensitivity: 2, match_window_tokens: 12}
    distribution:
      enabled: true
      thresholds: {policy: 1, sensitivity: 2, match_window_tokens: 12}
    services:
      enabled: true
      thresholds: {policy: 1, sensitivity: 2, match_window_tokens: 12}
    recruitment:
      enabled: true
      thresholds: {policy: 0, sensitivity: 2, match_window_tokens: 12}
  # Optional score caps do not disable mandatory review; absent means uncapped.
  family_caps: {}
trust:
  maximum_risk_discount: 20
  admin_reply_bonus_cap: 15
  stats_window_days: 30
ai:
  enabled: true
  provider: openai_compatible
  timeout_seconds: 15
  max_concurrent: 3
  optional_daily_request_limit: 200
  mandatory_jobs_bypass_optional_budget: true
  review_reported_messages: true
  # Initial model via AI_MODEL; /model can persist a runtime override in PostgreSQL.
  # Prices apply only to AI_MODEL, per million tokens in your provider's billing currency.
  # Zero prices or absent usage means cost unknown, not free.
  input_price_per_million: 0
  output_price_per_million: 0
# Optional NSFW media checks via fal-ai/imageutils/nsfw; requires FAL_KEY and ffmpeg.
media:
  enabled: false
  # Private replies are restricted to allowed_admin_ids, independently of admin-message ignore.
  private_replies: true
  cache_days: 30
  # Fal calls (frames), not messages. Zero pauses uncached checks; text MUST jobs are unaffected.
  daily_request_limit: 200
  review_threshold: 0.35
  nsfw_threshold: 0.75
  max_file_bytes: 10485760
  timeout_seconds: 30
retention:
  max_recent_messages_per_chat: 1000
  messages_days: 7
  incident_days: 30
  aggregate_days: 90
links:
  allow_domains: [google.com, youtube.com, youtu.be, tiktok.com, github.com]
  watch_domains: []
  deny_domains: []
  # Explicitly verified bot usernames, without @. Suffix bot alone remains a heuristic.
  known_bots: []
notifications:
  # Coalesce background evidence refreshes only; first cards, AI results and admin actions are immediate.
  batch_window_seconds: 20
  duplicate_cooldown_seconds: 300
  send_to_private_admins: false
