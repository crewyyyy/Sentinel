name: Go CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sentinel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sentinel_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/sentinel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l cmd internal migrations prompts)"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 180s ./...
      - run: docker build -f deploy/Dockerfile -t sentinel:ci .
      - run: go run ./cmd/sentinel inspect --file testdata/telegram_updates/promotion.json
