services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 12
    # No host port. The database is reachable only inside the Compose network.
  sentinel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      HEALTH_ADDR: 0.0.0.0:8080
    volumes:
      - ../configs/config.yaml:/app/configs/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64M
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s
    # Health/metrics are internal-only. Do not publish 8080 on a public interface.
volumes:
  database:
